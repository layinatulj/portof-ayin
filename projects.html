<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kumpulan aplikasi, website, dan media pembelajaran digital.">
  <meta name="theme-color" content="#2563eb">
  <title>Projects | Layinatul Janibah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script><script src="js/main.js" defer></script>
</head>
<body data-page="projects">
  <div id="site-header"></div>
  <main>
<section class="page-hero section-shell"><p class="eyebrow">SELECTED WORK</p><h1>Projects &amp; <span>Applications.</span></h1><p class="page-lead">Kumpulan website, aplikasi, dan game edukasi yang saya kembangkan untuk mengeksplorasi pemanfaatan teknologi dalam pembelajaran.</p></section>
<section class="section-shell projects-section">
  <div class="project-toolbar">
  <div class="filter-list" id="project-filters">
    <button class="filter-button active" data-filter="all">Semua</button>
    <button class="filter-button" data-filter="learning">Learning Application</button>
    <button class="filter-button" data-filter="portfolio">Portfolio Website</button>
    <button class="filter-button" data-filter="game">Educational Game</button>
  </div>

  <span class="project-count" id="project-count"></span>
</div>
  <div class="projects-grid" id="projects-grid"></div>
  <div class="empty-state" id="projects-empty" hidden>Belum ada proyek pada kategori ini.</div>
</section>
<div class="modal-backdrop" id="project-modal" aria-hidden="true">
  <section class="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" type="button" aria-label="Tutup detail">×</button>
    <div id="modal-content"></div>
  </section>
</div>
<div class="lightbox" id="image-lightbox" aria-hidden="true"><button class="lightbox-close" aria-label="Tutup gambar">×</button><button class="lightbox-prev" aria-label="Foto sebelumnya">‹</button><img alt="Dokumentasi proyek"><button class="lightbox-next" aria-label="Foto berikutnya">›</button><p class="lightbox-caption"></p></div>
<script src="js/projects-data.js" defer></script><script src="js/projects.js" defer></script>
</main>
  <div id="site-footer"></div>
</body>
</html>
